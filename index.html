<title>Nuevos Negocios SITÛ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: lámina corporativa SITÛ · Aspen. Blanco, regla roja y gris bajo el encabezado, marcas en sus esquinas. Apariencia única clara, como la plantilla. */
:root{color-scheme:light;--bg:#fff;--panel:#fff;--panel2:#f3f1f1;--ink:#2D3334;--mute:#5B6670;--line:#dcdfe1;--accent:#96323C;--accentfg:#fff;--rule2:#9AA5AC;--map:#eef0f1;--mapl:#b9c0c5;
--e0:#5B6670;--e1:#A26579;--e2:#96323C;--e3:#0F3A68;--e4:#b08a8e;--warn:#7a5a14;--warnbg:#f7efdc;--crit:#96323C;--critbg:#f6e7e8;--okbg:#e4ebf3;
--sans:"Roboto",system-ui,sans-serif;--mono:"Roboto Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.top{display:flex;align-items:center;gap:14px;padding-block:10px 8px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:#fff}
.top .chev{height:18px;width:auto}
.top .ttl{font-size:19px;font-weight:300;letter-spacing:.01em;color:var(--ink);min-width:0}
.top .ttl b{font-weight:500}
.top .aspen{height:46px;width:auto;margin-left:auto}
.rule{height:5px;display:flex;margin-left:max(20px,env(safe-area-inset-left,0px));margin-right:max(20px,env(safe-area-inset-right,0px))}
.rule i{display:block;height:100%}.rule i:first-child{width:49%;background:var(--accent)}.rule i:last-child{flex:1;background:var(--rule2)}
.app{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:calc(100% - 76px)}
.rail{background:#fff;color:var(--ink);padding-block:16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:10px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:calc(100vh - 76px)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--mute);text-decoration:none;padding:8px 10px;border-left:3px solid transparent;display:flex;justify-content:space-between;gap:8px}
.nav a:hover{background:var(--panel2)}
.nav a.on{border-left-color:var(--accent);color:var(--accent);font-weight:500}
.nav small{opacity:.8}
.who{margin-top:auto;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.situ{height:24px;width:auto;align-self:flex-start}
main{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
@media(min-width:900px){main{padding-left:28px;padding-right:28px}}
h1{font-size:22px;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--mute);margin:2px 0 16px;max-width:75ch}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.pipe button{background:var(--panel);border:0;padding:10px 12px;text-align:left;cursor:pointer;min-width:0}
.pipe button:hover,.pipe button.on{background:var(--panel2)}
.pipe b{display:block;font:300 26px var(--sans)}
.pipe span{font-size:12px;color:var(--mute);display:block}
.flags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.flag{border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:5px;cursor:pointer;font-size:13px}
.flag.w{background:var(--warnbg);border-color:transparent;color:var(--warn);font-weight:600}
.flag.on{outline:2px solid var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.bar input[type=search]{flex:1 1 200px;min-width:0}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:64px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accentfg);font-weight:600}
.btn.s{padding:3px 8px;font-size:12px}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-align:left;font-weight:500;padding:8px 8px;white-space:nowrap;background:var(--accent)}
td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.r{cursor:pointer}
tbody tr.r:hover td{background:var(--panel2)}
td.n,th.n{text-align:right;font-size:13px;white-space:nowrap}
td.d{white-space:nowrap;color:var(--mute);font-size:13px}
.nm{font-weight:600}
td:first-child{min-width:170px}
.meta{color:var(--mute);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;font-weight:500}
.pill i{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.pill.sug i{background:none;border:2px dotted currentColor}
h1{font-weight:300;font-size:24px}h2{font-weight:500;color:var(--accent)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;font-weight:600;white-space:nowrap}
.tag.w{background:var(--warnbg);color:var(--warn)}.tag.c{background:var(--critbg);color:var(--crit)}.tag.g{background:var(--okbg);color:var(--e3)}.tag.m{background:var(--panel2);color:var(--mute)}
.lam{position:fixed;inset:0;background:rgba(45,51,52,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{border-top:5px solid var(--accent);background:var(--bg);width:min(920px,100%);height:100%;overflow:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shd{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 11px;cursor:pointer;color:var(--mute);white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px}
.alert{padding:8px 12px;border-radius:5px;margin-bottom:10px;font-size:13px}
.alert.w{background:var(--warnbg);color:var(--warn)}.alert.c{background:var(--critbg);color:var(--crit)}
.step{display:flex;gap:0;margin-bottom:12px;flex-wrap:wrap}
.step div{flex:1 1 90px;padding:6px 8px;border-top:3px solid var(--line);font-size:12px;color:var(--mute)}
.step div.dn{border-color:var(--rule2);color:var(--ink)}.step div.cu{border-color:var(--accent);color:var(--ink);font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);min-width:0}
.form label.w{grid-column:1/-1}
.form label>*{color:var(--ink);font-size:14px;width:100%}
.sup{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.sup div b{display:block;font:400 18px var(--sans)}
.sup div span{font-size:12px;color:var(--mute)}
.path{font:12.5px var(--mono);overflow-wrap:anywhere;color:var(--mute)}
.maph{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
@media(max-width:980px){.maph{grid-template-columns:minmax(0,1fr)}}
.mapw{position:relative;background:var(--map);border:1px solid var(--line);border-radius:6px;overflow:hidden;height:min(66vh,620px);touch-action:none}
.mapw.sm{height:320px}
.mapw svg{width:100%;height:100%;display:block;cursor:grab}
.mapw.place svg{cursor:crosshair}
.mapw path,.mapw polygon{vector-effect:non-scaling-stroke}.mapw path{stroke-width:1px}
.zm{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.lg{position:absolute;left:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);padding:4px 8px;border-radius:5px;font-size:11px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.list{max-height:min(66vh,620px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.list button{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;cursor:pointer}
.list button:hover{background:var(--panel2)}
.tt{position:absolute;background:var(--panel);border:1px solid var(--line);padding:3px 8px;border-radius:4px;font-size:12px;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.2);max-width:220px}
.uc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px;margin-bottom:14px}
.meter{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:6px;display:flex}
.meter i{display:block;height:100%}
.empty{padding:28px;text-align:center;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(45,51,52,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:var(--panel);border-radius:8px;padding:18px;width:min(620px,100%);max-height:100%;overflow:auto}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:40;max-width:90%}
@media(max-width:760px){.top .aspen{height:36px}.top .ttl{font-size:16px}.top .chev{display:none}.app{grid-template-columns:minmax(0,1fr)}.rail{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-block:8px;gap:8px}.nav{flex-direction:row;overflow-x:auto;width:100%}.nav a{white-space:nowrap;padding:6px 9px;border-left:0;border-bottom:3px solid transparent}.nav a.on{border-bottom-color:var(--accent)}.nav small,.who{display:none}.situ{height:16px;margin-left:auto;align-self:center}.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}.pipe button:last-child{grid-column:1/-1}}

  const cv=(it.cb||[]).filter(x=>!x.o),ev=(it.ev||[]).filter(x=>!x.o);
  p.fcab=Math.max(cv[0]?.d||0,p.vc[0]?.at||0);p.feval=Math.max(ev[0]?.d||0,p.ve[0]?.at||0);
  p.tipo=p.tipo||'Terreno';p.reqCab=p.tipo==='Terreno'&&!p.sinCabida;p.sinEval=!!ov.sinEval;
  p.stale=p.feval>0&&p.fcab>p.feval+DAY;
  let sug=p.feval?(p.stale?2:3):(p.fcab?2:0);
  p.sug=!ov.estado;p.estado=ov.estado||ESTADOS[sug];

  p.activo=ov.archivado?false:(ov.estado&&ov.estado!=='Descartado'&&!!ov.estado)||ov.nuevo||ov.responsable||(p.mod>=NOW-365*DAY);
  const v=p.vc[0]?.sup;p.sup=v&&Object.keys(v).length?v:(it.sup||{});
  return p}

  return L.sort(k)}

  ${p.reqCab?`<label>Cabida base<select name="cabidaId">${opts(p.vc.map(v=>[v.id,v.version+' · '+fmtD(v.at)]),p.vc[0]?.id||'',p.vc.length?null:'Cabida en carpeta')}</select></label>`:''}
  <label>Adjuntar Excel o PDF (opcional)<input type="file" id="ff" accept=".xlsx,.xlsm,.xls,.pdf"></label><label class="w">Ruta en el disco D<input name="ruta" placeholder="1. Evaluaciones\\20261105 - Venta Proyecto.xlsx"></label>
  <label class="w">Observaciones<textarea name="nota" required></textarea></label><div class="meta" id="fmsg" style="grid-column:1/-1"></div></form><div class="acts"><button class="btn" data-a="cm">Cancelar</button><button class="btn p" data-a="gv" data-pid="${p.id}">Guardar evaluación</button></div>`)}
function fNew(){modal(`<h2>Nuevo proyecto</h2><form id="fn" class="form"><label class="w">Nombre<input name="nombre" required></label><label>Tipo<select name="tipo">${opts(['Terreno','Inmueble','Proyecto','Asesoría'],'Terreno')}</select></label><label>Comuna<input name="comuna" list="dlc" required><datalist id="dlc">${Object.keys(COMUNAS).map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label><label>Responsable<select name="responsable">${opts(userOpts(),'','Sin asignar')}</select></label><label>Prioridad<select name="prioridad">${opts(PRIO,'','—')}</select></label><label class="w">Carpeta en Nuevos Negocios<input name="ruta" placeholder="1. Terrenos/4. Las Condes/Nombre"></label></form><div class="acts"><button class="btn" data-a="cm">Cancelar</button><button class="btn p" data-a="gn">Crear proyecto</button></div>`)}
async function loadX(){if(window.XLSX)return;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.append(s)})}
async function readSup(file){await loadX();const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const out={};const R=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,blankrows:false}).map(r=>r.filter(x=>x!==null&&x!==undefined&&x!=='')):[];
  const M={'superficie terreno':'terreno','superficie neta terreno completo':'terreno','total vendible':'vendible','unidades':'unidades','estacionamientos':'estac','bodegas':'bodegas','const. efectiva':'consef'};
  for(const r of [...R('HISTORIAL SUP'),...R('SUP MUNICIPALES ')]){const k=M[String(r[0]||'').trim().toLowerCase()];const nums=r.slice(1).filter(x=>typeof x==='number');if(k&&nums.length&&out[k]==null)out[k]=nums.length>1?nums[nums.length-2]:nums[0]}
  const inc=R('INCIDENCIA');let c=0;for(const r of inc)r.forEach((x,i)=>{if(typeof x!=='string')return;const l=x.trim().toLowerCase();if(l.startsWith('superficie')&&out.terreno==null&&typeof r[i+1]==='number')out.terreno=r[i+1];if(l.startsWith('sup. vendible')){c++;if(c===2&&out.vendible==null)out.vendible=r[i+1]}if(l.startsWith('viviendas')&&out.unidades==null&&typeof r[i+1]==='number')out.unidades=Math.round(r[i+1]);if(l.startsWith('construc. efectiva')&&out.consef==null)out.consef=r[i+1]});return out}
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32766)s+=String.fromCharCode.apply(null,u.subarray(i,i+32766));return btoa(s)}
async function saveV(pid){const fm=$('#fv');if(!fm.reportValidity())return;const d=Object.fromEntries(new FormData(fm));const clase=fm.dataset.clase;const p=proj(pid);const file=$('#ff').files[0];const msg=$('#fmsg');const btn=$('[data-a=gv]');btn.disabled=true;
  try{const v={pid,clase,version:d.version,nota:d.nota,ruta:d.ruta||'',subtipo:d.subtipo||'',cabidaId:d.cabidaId||'',by:S.me?.id||'',at:Date.now(),archivo:file?.name||'',link:''};
    if(file){msg.textContent='Subiendo archivo…';if(file.size>35*1048576)throw{code:'big'};const u=await api('subir',{pid,name:file.name,mime:file.type,b64:b64(await file.arrayBuffer())});v.link=u.url}
    if(clase==='cabida'){v.sup={};for(const[k]of SUPF)if(d['s_'+k]!=='')v.sup[k]=+d['s_'+k]}
        const ref=await api('addVersion',{doc:v});S.vers.push({...v,id:ref.id});
    const next=clase==='cabida'?'Evaluación financiera':'Evaluado';const old=p.estado;await log(p,clase==='cabida'?'Cabida':'Evaluación','',d.version+(file?' · '+file.name:''),d.nota);
    if(old!==next){await setOv(pid,{estado:next});await log(p,'Estado',old,next,'Automático al guardar '+clase)}else render();closeM();toast('Versión guardada')}
  catch(e){btn.disabled=false;msg.textContent=e?.code==='big'?'El archivo supera 35 MB. Guarda sin adjuntar e indica la ruta del disco D.':'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.'}}

/* ---------- eventos ---------- */
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){S.f.q=t.value;S.f.n=60;render()}if(t.id==='lq'){S.lf=t.value;render()}});
document.addEventListener('change',async e=>{const t=e.target,c=t.dataset;
  if(t.id==='ft'){S.f.tipo=t.value;render()}if(t.id==='fc'){S.f.comuna=t.value;render()}if(t.id==='fr'){S.f.resp=t.value;render()}if(t.id==='fs'){S.f.sort=t.value;render()}
  if(t.id==='mfe'){S.mf.est=t.value;render()}if(t.id==='mfv'){S.mf.vista=t.value;render()}
  if(c.ch){const lab={estado:'Estado',responsable:'Responsable',prioridad:'Prioridad',fecha:'Compromiso',notas:'Notas',comuna:'Comuna',evalModo:'Evaluación'}[c.ch];change(c.id,c.ch,lab,t.value,c.ch==='responsable'?uname:null)}
  if(c.ej){const p=proj(c.id);const e2={...(p.ejec||{}),[c.ej]:t.value};try{await setOv(c.id,{ejec:e2});await log(p,'Ejecución · '+c.ej,'',t.value)}catch(x){err(x)}}
  if(c.rol){try{await api('setRol',{id:c.rol,rol:t.value});toast('Rol actualizado');pull()}catch(x){err(x)}}
  if(t.id==='invf'&&t.files[0]){try{toast('Cargando inventario…');const a=JSON.parse(await t.files[0].text());await api('setInventario',{items:a.items});S.items=a.items;render();toast(a.items.length+' proyectos cargados')}catch(x){err(x)}}
  if(t.id==='ff'&&/\.xls[xm]?$/i.test(t.files[0]?.name||'')&&$('#fv')?.dataset.clase==='cabida'){const m=$('#fmsg');try{m.textContent='Leyendo superficies del Excel…';const s=await readSup(t.files[0]);let n=0;for(const k in s){const i=document.querySelector(`[name=s_${k}]`);if(i&&s[k]!=null){i.value=Math.round(s[k]*100)/100;n++}}m.textContent=n?n+' campos completados desde el Excel. Revísalos antes de guardar.':'No se reconocieron superficies en este Excel. Complétalas a mano.'}catch(x){m.textContent='No se pudo leer el Excel. Complétalas a mano.'}}});
document.addEventListener('click',async e=>{const t=e.target.closest('button,a,tr.r,.lam');if(!t)return;const c=t.dataset;const pid=route().startsWith('p-')?route().slice(2):null;const p=pid&&proj(pid);
  if(c.close&&e.target===t){location.hash=S.lastBase||'repositorio';return}
  if(c.p&&t.tagName!=='CIRCLE'){S.tab='res';S.placing=false;location.hash='p-'+c.p;return}
  if(c.est!=null&&t.closest('.pipe')){S.f.est=S.f.est===c.est?'':c.est;render();return}
  if(c.v){S.f.vista=c.v;S.f.n=60;render();return}
  if(c.tab){S.tab=c.tab;S.placing=false;render();return}
  if(c.pu!=null){S.pf.resp=c.pu;render();return}
  if(c.copy!=null){try{await navigator.clipboard.writeText(c.copy);toast('Ruta copiada')}catch{toast(c.copy)}return}
  const a=c.a;if(!a)return;
  if(a==='nuevo')fNew();if(a==='mas'){S.f.n+=60;render()}if(a==='cerrar')location.hash=S.lastBase||'repositorio';if(a==='cm')closeM();
  if(a==='cabida')fCab(p);if(a==='evaluacion')fEva(p);if(a==='gv')saveV(c.pid);
  if(a==='confirmar')change(pid,'estado','Estado',p.estado);
  if(a==='ejec')change(pid,'ejecucion','Ejecución',!p.ejecucion,v=>v?'En ejecución':'No');
  if(a==='arch')change(pid,'archivado','Histórico',!p.archivado,v=>v?'Sí':'No');
  if(a==='fijar'){S.placing=!S.placing;render()}
  if(a==='ll'){const m=($('#ll').value||'').match(/(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/);if(!m){toast('Escribe latitud y longitud, por ejemplo -33.40, -70.59');return}placeAt(p,+m[2],+m[1])}
  if(a==='gn'){const f=$('#fn');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));const id='n'+Date.now();const n={...d,nuevo:true,n:0};try{await setOv(id,n);await log({id,nombre:d.nombre},'Proyecto','','Creado');closeM();S.tab='res';location.hash='p-'+id}catch(x){err(x)}}
  if(a==='salir')salir();
});
addEventListener('hashchange',render);

/* ---------- arranque ---------- */
function fail(m){$('#main').innerHTML=`<div class="empty"><h1>No se pudieron cargar los proyectos</h1><p>${esc(m)}</p></div>`}
let TOKEN=null,_pollT=null,_cred=null;
function claims(j){try{const b=j.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b))))}catch{return{}}}
async function api(op,data={},reint=true){const r=await fetch(window.API_URL,{method:'POST',credentials:'omit',cache:'no-store',body:JSON.stringify({token:TOKEN,op,...data})});const o=await r.json();
  if(o.error==='sesion'){if(reint&&await renovar())return api(op,data,false);pantallaIngreso('Tu sesión venció. Ingresa de nuevo.');throw new Error('sesion')}
  if(o.error==='dominio'){salir();pantallaIngreso('Solo se permiten cuentas @situ.cl.');throw new Error('dominio')}
  if(o.error)throw new Error(o.detalle||o.error);return o}
function renovar(){return new Promise(ok=>{let f=false;_cred=c=>{f=true;ok(!!c)};try{google.accounts.id.prompt(n=>{if(!f&&(n.isNotDisplayed?.()||n.isSkippedMoment?.())){f=true;ok(false)}})}catch{ok(false)}setTimeout(()=>{if(!f)ok(false)},8000)})}
function pantallaIngreso(msg){$('#main').innerHTML=`<div class="empty"><h1>Ingresa con tu cuenta SITÛ</h1><p>${esc(msg||'Acceso exclusivo para cuentas @situ.cl.')}</p><div id="gbtn" style="display:flex;justify-content:center"></div></div>`;$('#who').textContent='';S.ready=false;clearInterval(_pollT);
  try{google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',text:'signin_with',locale:'es'})}catch{}}
function salir(){TOKEN=null;S.ready=false;clearInterval(_pollT);try{google.accounts.id.disableAutoSelect()}catch{}pantallaIngreso()}
function onCred(r){const c=claims(r.credential);if(c.hd!=='situ.cl'){pantallaIngreso('Solo se permiten cuentas @situ.cl.');return}TOKEN=r.credential;if(_cred){const f=_cred;_cred=null;f(true);return}iniciar(c)}
async function pull(primera){try{const o=await api('load',{ver:primera?'':S.ver,inventario:!S.items.length,nombre:S.me.name});if(o.igual)return;S.ver=o.ver;if(o.items)S.items=o.items;S.ov=o.proyectos;S.vers=o.versiones;S.log=o.cambios.sort((a,b)=>b.at-a.at);S.users=o.usuarios;S.ready=true;if(!$('#modal').innerHTML)render()}catch(e){if(primera&&e.message!=='sesion'&&e.message!=='dominio')fail('No se pudo conectar con los datos. Recarga la página.')}}
async function iniciar(c){S.me={id:String(c.email).toLowerCase(),name:c.name||c.email,email:String(c.email).toLowerCase()};$('#main').innerHTML='<div class="empty">Cargando proyectos…</div>';$('#who').innerHTML=esc(S.me.name)+'<br><button class="btn s" data-a="salir" style="margin-top:6px">Salir</button>';await pull(true);clearInterval(_pollT);_pollT=setInterval(()=>{if(!document.hidden&&TOKEN)pull()},45000)}
function boot(){render();const go=()=>{if(!window.google?.accounts?.id){setTimeout(go,150);return}google.accounts.id.initialize({client_id:window.CLIENT_ID,callback:onCred,auto_select:true,hd:'situ.cl',ux_mode:'popup'});pantallaIngreso();google.accounts.id.prompt()};go()}
boot();
</script>
